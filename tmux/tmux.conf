# ─── Prefix ───────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── General ──────────────────────────────────────────────
set -g mouse off                    # full keyboard workflow, no mouse
set -g base-index 1                 # windows start at 1
setw -g pane-base-index 1           # panes start at 1
set -g renumber-windows on          # keep window numbers tidy
set -g escape-time 0                # no delay after Escape (important for vim/editors)
set -g history-limit 50000          # generous scrollback
set -g display-time 2000            # status messages visible longer
set -g focus-events on              # pass focus events to apps

# True color + undercurl support (Ghostty handles this well)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc,xterm-ghostty:RGB"

# ─── Splits ───────────────────────────────────────────────
# Intuitive split keys: | for vertical, - for horizontal
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# ─── Pane Navigation (vim-style) ─────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl for pane nav without prefix (fast switching)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ─── Pane Swapping ────────────────────────────────────────
bind H swap-pane -t -1             # move pane left/up
bind L swap-pane -t +1             # move pane right/down
bind J swap-pane -D                # swap with pane below
bind K swap-pane -U                # swap with pane above

# ─── Pane Resizing ────────────────────────────────────────
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# ─── Layouts ──────────────────────────────────────────────
bind = select-layout tiled          # equal-size tiled
bind v select-layout main-vertical  # one big pane + stacked side panes
bind b select-layout main-horizontal

# ─── Windows ──────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

# Quick window switching with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ─── Zoom / Break / Join ─────────────────────────────────
bind z resize-pane -Z               # toggle zoom (fullscreen a pane)
bind ! break-pane                    # break pane to its own window
bind @ choose-window "join-pane -h -t '%%'"  # join pane from another window

# ─── Copy Mode (vi keys) ─────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ─── Status Bar ───────────────────────────────────────────
set -g status-position top
set -g status-style "bg=default,fg=#8a8a8a"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#c0c0c0,bold] #S "
set -g status-right "#[fg=#6a6a6a]%H:%M "
set -g window-status-format "#[fg=#6a6a6a] #I:#W "
set -g window-status-current-format "#[fg=#e0e0e0,bold] #I:#W "
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#666666"
set -g message-style "fg=#e0e0e0,bg=default"

# ─── Reload Config ────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
